#
# WCH CH32V00X: CH32V002, CH32V004, CH32V005, CH32V006, CH32V007
#

if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
} else {
	set _CHIPNAME ch32v00x
}

# The smallest RAM is 4 KiB (CH32V002). Set WORKAREASIZE for a larger part.
if { [info exists WORKAREASIZE] } {
	set _WORKAREASIZE $WORKAREASIZE
} else {
	set _WORKAREASIZE 0x1000
}

source [find target/wch/ch32v.cfg]

# The CH32V006 refuses the program buffer (cmderr 2) for memory accesses.
$_TARGETNAME riscv mem_access abstract
