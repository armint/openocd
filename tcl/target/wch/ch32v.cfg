#
# Common part of the WCH CH32V target configs
#
# The chips have no JTAG port. Their debug wire (one wire on the CH32V00x,
# two wires on the CH32V20x) needs an adapter that gives a RISC-V JTAG DTM
# (debug spec 0.13) for it. Set CPUTAPID to the IDCODE of that DTM, or leave
# it unset to accept any IDCODE.
#
# The family configs set _CHIPNAME and _WORKAREASIZE, then source this file.
#

transport select jtag

if { [info exists CPUTAPID] } {
	jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id $CPUTAPID
} else {
	jtag newtap $_CHIPNAME cpu -irlen 5
}

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -tap $_TARGETNAME

# No MMU
$_TARGETNAME riscv virt2phys_mode off

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

set _FLASHNAME $_CHIPNAME.flash
flash bank $_FLASHNAME ch32v 0x08000000 0 0 0 $_TARGETNAME
# The WCH SDK links programs to the boot alias of the flash at 0x00000000.
flash bank $_CHIPNAME.alias virtual 0x00000000 0 0 0 $_TARGETNAME $_FLASHNAME
