#
# WCH CH32V20x
#

if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
} else {
	set _CHIPNAME ch32v20x
}

# The smallest RAM is 10 KiB (CH32V203x6). Set WORKAREASIZE for a larger part.
if { [info exists WORKAREASIZE] } {
	set _WORKAREASIZE $WORKAREASIZE
} else {
	set _WORKAREASIZE 0x2800
}

source [find target/wch/ch32v.cfg]

# The QingKe V4 core reads tinfo as 0 and hardwires tdata1.dmode to 0, but
# its 4 mcontrol triggers enter Debug Mode.
$_TARGETNAME configure -ignore-tinfo on -ignore-tdata1-dmode on
