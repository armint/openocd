#
# WCH CH32V30x: CH32V303, CH32V305, CH32V307
#

if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
} else {
	set _CHIPNAME ch32v30x
}

# SRAM_CODE_MODE can leave 32 KiB of SRAM, the smallest RAM of the family.
# Set WORKAREASIZE for more.
if { [info exists WORKAREASIZE] } {
	set _WORKAREASIZE $WORKAREASIZE
} else {
	set _WORKAREASIZE 0x8000
}

source [find target/wch/ch32v.cfg]

# The QingKe V4F core reads tinfo as 0 and hardwires tdata1.dmode to 0, but
# its mcontrol triggers enter Debug Mode. It never sets allresumeack.
$_TARGETNAME configure -ignore-tinfo on -ignore-tdata1-dmode on -ignore-resumeack on
